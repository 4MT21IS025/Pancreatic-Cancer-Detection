<!DOCTYPE html>
<html lang="en">
<head>
    <style>body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden; /* Prevent horizontal scrolling */
        line-height: 1.6; /* Improve readability with line spacing */
    }
    
    /* Header */
    header {
        background-color: #000;
        padding: 10px 20px;
        color: white;
        display: flex;
        justify-content: space-between; /* Aligns logo and navigation */
        align-items: center; /* Full width */
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Add subtle shadow for header */
    }
    
    /* Navigation Menu */
    nav ul {
        list-style-type: none;
        display: flex;
        justify-content: flex-end; /* Aligns menu items to the right */
        gap: 20px; /* Spacing between menu items */
        margin: 0;
        background-color: #000;
    }
    
    nav ul li {
        margin: 0;
    }
    
    nav ul li a {
        text-decoration: none;
        color: white;
        font-weight: bold;
        padding: 10px 15px;
        display: inline-block;
        transition: background-color 0.3s ease;
        font-size: 1.1rem;
        border-radius: 5px;
    }
    
    nav ul li a:hover {
        background-color: #575757;
    }
    footer {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 2px 0; /* Reduced padding for footer */
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 0.9rem;
            margin: 0;
        }</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Page</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/prediction">Predict</a></li>
                <li><a href="/prediction/analyse">Analyse</a></li>
                <li><a href="/prediction/recommendations">Recommendations</a></li>
            </ul>
        </nav>
        <h1 class="mt-5">Data Analysis</h1>
        <p class="lead">Below is the analysis chart based on your data.</p>

        <div class="mt-4">
            <h3>Analysis Chart</h3>
            <!-- Display the chart image dynamically -->
            <img src="data:image/png;base64,{{ chart_img }}" alt="Analysis Chart" class="img-fluid">
        </div>

        <div class="mt-4">
            <a href="/" class="btn btn-primary">Go Back to Prediction Page</a>
        </div>
    </div>
    <footer>
        <p>&copy; 2024 Pancreatic Cancer Detection Tool. All Rights Reserved.</p>
    </footer>

    <!-- Optional: Add Bootstrap JS or other scripts if needed -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
